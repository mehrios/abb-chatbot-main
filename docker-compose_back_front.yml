version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: abb_backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    ports:
      - "8100:8100"
    network_mode: "host"
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: abb_frontend
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8100
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    ports:
      - "3000:3000"
    network_mode: "host"
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  backend_logs: