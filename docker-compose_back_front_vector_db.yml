version: '3.8'

services:
  # Milvus - Vector Database
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: abb_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - abb_network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: abb_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - abb_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: abb_milvus
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    networks:
      - abb_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: ["milvus", "run", "standalone"]

  # Redis Cache
  redis:
    image: redis/redis-stack:latest
    container_name: abb_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--appendonly yes
    command: redis-stack-server
    networks:
      - abb_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: abb_backend
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs
    ports:
      - "8100:8100"
    networks:
      - abb_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: abb_frontend
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8100
    ports:
      - "3000:3000"
    networks:
      - abb_network
    restart: unless-stopped

  # Vector DB Initialization (runs once)
  vector_db_init:
    build:
      context: .
      dockerfile: Dockerfile.vector_db
    container_name: abb_vector_init
    depends_on:
      milvus:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./scripts:/app/data
    networks:
      - abb_network
    profiles:
      - init

  # Web Scraper (runs on demand)
  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scripts
    container_name: abb_scraper
    volumes:
      - ./scripts:/app/data
    networks:
      - abb_network
    profiles:
      - scraper

networks:
  abb_network:
    driver: bridge

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  backend_data:
  backend_logs: